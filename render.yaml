services:
  - type: web
    name: mindspark
    runtime: node
    branch: main
    buildCommand: npm install && npm run db:generate && npm run db:migrate && npm run db:seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_EMAIL
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: SATELLITE_API_KEY
        sync: false
      - key: SATELLITE_API_URL
        sync: false
